<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
        }

        h1 {
            font-size: 5rem;
            cursor: pointer;
            user-select: none;
            background: linear-gradient(90deg, #ff6ec4, #7873f5, #4ade80, #facc15, #ff6ec4);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s ease infinite, float 3s ease-in-out infinite;
            text-shadow: none;
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(0 0 20px rgba(120, 115, 245, 0.5));
        }

        h1:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 40px rgba(255, 110, 196, 0.8));
        }

        h1:active {
            transform: scale(0.95);
        }

        h1.clicked {
            animation: gradient-shift 1.5s ease infinite, bounce 0.6s ease, glow-pulse 2s ease-in-out infinite;
            font-size: 5rem;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes bounce {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.15); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes glow-pulse {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(120, 115, 245, 0.5)); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 110, 196, 0.9)); }
        }

        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            animation: particle-fade 1s ease-out forwards;
        }

        @keyframes particle-fade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <h1 id="message">Hello World</h1>
    <script>
        const message = document.getElementById("message");
        const colors = ["#ff6ec4", "#7873f5", "#4ade80", "#facc15", "#38bdf8", "#f472b6"];

        function spawnParticles(x, y) {
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement("div");
                particle.classList.add("particle");
                const size = Math.random() * 12 + 4;
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 150 + 50;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.width = size + "px";
                particle.style.height = size + "px";
                particle.style.background = color;
                particle.style.left = x + "px";
                particle.style.top = y + "px";
                particle.style.boxShadow = `0 0 ${size}px ${color}`;
                particle.animate([
                    { transform: "scale(1) translate(0, 0)", opacity: 1 },
                    { transform: `scale(0) translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`, opacity: 0 }
                ], { duration: 800 + Math.random() * 400, easing: "ease-out" });
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1200);
            }
        }

        message.addEventListener("click", function (e) {
            spawnParticles(e.clientX, e.clientY);
            this.textContent = "you see?!";
            this.classList.add("clicked");
        });
    </script>
</body>
</html>
